name: Update workflow index

on:
  push:
    branches: [main]
    paths-ignore:
      - 'workflows.json'
      - 'index.html'
      - '.github/**'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate workflows.json
        run: python generate_index.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workflows.json
          git diff --staged --quiet || git commit -m "chore: update workflow index [skip ci]"
          git push